<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventario DEGASA</title>

<link href="https://unpkg.com/tabulator-tables@5.6.2/dist/css/tabulator.min.css" rel="stylesheet">

<style>
    body{
        font-family: Arial, sans-serif;
        margin:20px;
        background:#f5f5f5;
    }

    h1{
        margin-bottom:10px;
    }

    .contenedor{
        background:white;
        padding:20px;
        border-radius:10px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
        margin-bottom:30px;
    }

    input{
        padding:10px;
        width:300px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    .kpis{
        display:flex;
        gap:20px;
        margin-bottom:20px;
        flex-wrap:wrap;
    }

    .kpi{
        background:#ffffff;
        padding:15px;
        border-radius:10px;
        min-width:180px;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .kpi h3{
        margin:0;
        font-size:14px;
        color:#666;
    }

    .kpi p{
        margin-top:10px;
        font-size:24px;
        font-weight:bold;
    }
</style>
</head>

<body>

<h1>Portal Inventario DEGASA</h1>

<div class="kpis">
    <div class="kpi">
        <h3>Total registros</h3>
        <p id="totalRegistros">0</p>
    </div>

    <div class="kpi">
        <h3>Materiales únicos</h3>
        <p id="materialesUnicos">0</p>
    </div>
</div>

<div class="contenedor">
    <h2>Inventario por Lote</h2>

    <input type="text" id="buscar1" placeholder="Buscar...">

    <div id="tabla1"></div>
</div>

<div class="contenedor">
    <h2>Resumen Inventario</h2>

    <input type="text" id="buscar2" placeholder="Buscar...">

    <div id="tabla2"></div>
</div>

<script src="https://unpkg.com/tabulator-tables@5.6.2/dist/js/tabulator.min.js"></script>

<script>

//////////////////////////////////////////////////
// CONFIGURA TU SHEET
//////////////////////////////////////////////////

const SHEET_ID = "2PACX-1vRPOd1N3jHSgP2GFA5oPseYHlPO93dabX9u3RzVhr_ZdkcN-b4n8vGcVLR6YblSojqFw0EvazjCzibL";

const hoja1 = "Inv Consolidado";
const hoja2 = "Inv Detalle";

//////////////////////////////////////////////////
// URLS
//////////////////////////////////////////////////

const url1 =
`https://opensheet.elk.sh/${SHEET_ID}/${hoja1}`;

const url2 =
`https://opensheet.elk.sh/${SHEET_ID}/${hoja2}`;

//////////////////////////////////////////////////
// TABLA 1
//////////////////////////////////////////////////

fetch(url1)
.then(res => res.json())
.then(data => {

    document.getElementById("totalRegistros").innerText = data.length;

    const materiales = [...new Set(data.map(x => x.Material))];
    document.getElementById("materialesUnicos").innerText = materiales.length;

    const tabla1 = new Tabulator("#tabla1", {
        data:data,
        layout:"fitDataStretch",
        pagination:true,
        paginationSize:20,
        movableColumns:true,
        responsiveLayout:"collapse",

        columns:[
            {title:"Material", field:"Material", headerFilter:true},
            {title:"Texto breve", field:"Texto breve de material", headerFilter:true},
            {title:"Centro", field:"Centro", headerFilter:true},
            {title:"Almacén", field:"Almacén", headerFilter:true},
            {title:"Lote", field:"Lote", headerFilter:true},
            {title:"Fecha Caducidad", field:"FechaCaducidad", headerFilter:true},
            {title:"Cantidad", field:"CantidadDisp", headerFilter:true},
        ],
    });

    document.getElementById("buscar1").addEventListener("keyup", function(){
        tabla1.setFilter([
            [
                {field:"Material", type:"like", value:this.value},
            ]
        ]);
    });

});

//////////////////////////////////////////////////
// TABLA 2
//////////////////////////////////////////////////

fetch(url2)
.then(res => res.json())
.then(data => {

    const tabla2 = new Tabulator("#tabla2", {
        data:data,
        layout:"fitDataStretch",
        pagination:true,
        paginationSize:20,
        movableColumns:true,
        responsiveLayout:"collapse",

        columns:[
            {title:"Condición", field:"Condicion", headerFilter:true},
            {title:"Material", field:"Material", headerFilter:true},
            {title:"Texto", field:"Texto breve de material", headerFilter:true},
            {title:"Disponible", field:"Disponible 1031-1030", headerFilter:true},
            {title:"Inv 1017", field:"Inv 1017", headerFilter:true},
            {title:"Inv 1018", field:"Inv 1018", headerFilter:true},
            {title:"Inv Suma", field:"Inv Suma", headerFilter:true},
            {title:"Precio", field:"Precio", headerFilter:true},
        ],
    });

    document.getElementById("buscar2").addEventListener("keyup", function(){
        tabla2.setFilter([
            [
                {field:"Material", type:"like", value:this.value},
            ]
        ]);
    });

});

//////////////////////////////////////////////////
// ACTUALIZAR AUTOMÁTICAMENTE
//////////////////////////////////////////////////

setInterval(() => {
    location.reload();
}, 300000);

</script>

</body>
</html>
